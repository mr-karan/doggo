name: Go tests

on:
  push:
  pull_request:
  schedule:
    - cron: "22 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-validation:
    name: Release configuration and installer
    # Pull requests cover branch pushes; keep push validation only for main and release tags.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Check installer
        run: |
          for script in install.sh scripts/test-install.sh scripts/check-release-artifacts.sh; do
            sh -n "${script}"
          done
          sh scripts/test-install.sh
      - name: Check GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: v2.18.3
          args: check
      - name: Check normal CLI build gate
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: v2.18.3
          args: build --snapshot --clean --skip=before --id cli --single-target
      - name: Check normal CLI build output
        run: |
          test -x dist/cli_linux_amd64_v1/doggo
          cli_binary_count="$(find dist -mindepth 2 -maxdepth 2 -type f -name doggo | wc -l | tr -d ' ')"
          test "${cli_binary_count}" -eq 1
      - name: Build snapshot release archives
        uses: goreleaser/goreleaser-action@v7.3.0
        # This validation needs only the ARM builds; real tagged releases do not set this switch.
        env:
          DOGGO_RELEASE_ARM_ONLY: "1"
        with:
          version: v2.18.3
          args: release --snapshot --clean --skip=before,docker
      - name: Check ARM release artifacts
        run: sh scripts/check-release-artifacts.sh

  web-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.12.0"
      - run: node --test web/edns_test.js

  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.12.0"
      - run: yarn install --frozen-lockfile
        working-directory: docs
      - run: yarn build
        working-directory: docs

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        deps:
          - locked
          - latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: |
          if [ "${{ matrix.deps }}" = "latest" ]; then
            go get -u -t ./...
          fi
          go test -v ./...
